<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKILL Fitness</title>
<meta name="theme-color" content="#FBF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKILL">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar, full-screen sheets for workout details and the timer.
   Look: deep navy, cyan for action, pink for emphasis. Muscles glow in each workout's own colour. */
:root{
  --bg:#FBF7EC; --surface:#FFFEF9; --surface2:#F3EBD7; --line:#E3DCC4;
  --fg:#1F3A2B; --dim:#5C7266;
  --accent:#3A7350; --pink:#B85C30; --good:#4E8F5E; --warn:#9A6B12; --violet:#3A7350;
  --sil:#E7E0CA; --off:#D3DCC4;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  --on:#FFFFFF; --mline:#8E9A84; --ink:#1A1F1B; --olive:#A0B672;
}
:root[data-theme="dark"]{
  --bg:#0F1A14; --surface:#16241C; --surface2:#1F3328; --line:#2D4838;
  --fg:#F3EFDF; --dim:#9DB3A5;
  --accent:#7CC79A; --pink:#E39A6E; --good:#7CC79A; --warn:#E3B04B; --violet:#7CC79A;
  --sil:#2A3E31; --off:#3A5646; --on:#0B140F; --mline:#1B2A20; --ink:#D5E0D2; --olive:#7E9A55;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto}
main{padding-top:22px;padding-bottom:92px;display:flex;flex-direction:column;gap:26px}

/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.h1{font:700 26px/1.15 var(--display);text-wrap:balance}
.h2{font:700 17px/1.2 var(--display)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* tags */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--c,var(--accent));background:var(--surface2);background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}

/* buttons */
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--fg)}
.btn.primary{background:var(--c,var(--accent));color:var(--on)}
.btn.small{min-height:38px;padding:0 16px;font-size:13px;border-radius:12px}
.btn:active{transform:scale(.98)}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px}
.strip>div{padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--dim)}

/* hero / cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.hero .name{font:700 24px/1.15 var(--display);color:var(--c)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700}
.meta .k{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

.scroller{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mini i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mini b{font-weight:800;font-size:15px}
.mini span{font-size:12px;color:var(--dim)}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on)}

/* workout cards */
.list{display:flex;flex-direction:column;gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:6px 12px;text-align:left;width:100%}
.wcard .name{font:700 17px/1.2 var(--display);color:var(--c)}
.wcard .desc{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wcard .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.wcard .side{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:8px}
.wcard .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}

svg.body{display:block;width:100%;height:auto}
svg.body text{fill:var(--dim);font:700 11px var(--body);letter-spacing:.08em}

/* detail + timer sheets */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.ov-head{display:flex;align-items:center;gap:12px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.ov-head .t{font-weight:800;color:var(--dim);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-body{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actions .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.actions .btn.primary{flex:1}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--c,var(--fg))}
.tile span{font-size:12px;color:var(--dim)}

.load{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;align-items:center;font-size:13px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}

.ex{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--on);font:700 14px var(--display);display:grid;place-items:center}
.ex b{font-size:15px;font-weight:800}
.ex .m{font-size:12px;font-weight:700;color:var(--warn);margin:1px 0 4px}
.ex p{font-size:13px;color:var(--dim)}
.ex .tags{margin-top:8px}
.ex .tag{font-size:11px;padding:2px 8px}

/* timer */
.t-body{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:2px}
.phase{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.t-ex{font:700 24px/1.15 var(--display);text-wrap:balance}
.ring{position:relative;width:min(64vw,250px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .rt{stroke:var(--line)}
.ring .rp{stroke:var(--c);stroke-linecap:round}
.t-time{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(40px,14vw,60px) var(--display);font-variant-numeric:tabular-nums}
.t-stats{display:flex;gap:28px;justify-content:center}
.t-stats div{display:flex;flex-direction:column}
.t-stats b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.t-stats span{font-size:12px;color:var(--dim)}
.t-map{width:100%;max-width:340px}
.confirm{width:100%;background:var(--surface);border:1px solid var(--pink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.done-num{font:700 56px/1 var(--display);color:var(--warn);font-variant-numeric:tabular-nums}

/* schedule + progress */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--dim)}
.inp{width:100%;min-height:46px;padding:0 12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{font-weight:800;color:var(--c)}
.entry .sub{font-size:12px;color:var(--dim)}
.today{color:var(--accent);font-weight:800}
.empty{color:var(--dim);font-size:14px;padding:18px 0}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .nm{font-weight:800;color:var(--c)}
.hist .k{color:var(--warn);font-weight:800;text-align:right}
.hist .sub{font-size:12px;color:var(--dim)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font:700 11px var(--body)}
.chart .v{fill:var(--fg)}

.pfig{display:block;width:100%;height:auto;border-radius:18px}
.exfig{margin:8px 0 10px}
.t-fig{width:100%;max-width:340px}
/* nav + toast */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim);border-radius:12px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
/* onboarding questionnaire */
#onb{z-index:40}
.onb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.onb-skip{min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:14px;color:var(--dim)}
.onb-body{display:flex;flex-direction:column;gap:22px;padding-top:10px}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sex label{min-height:46px;padding:6px 10px;text-align:center;line-height:1.2;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dim);cursor:pointer}
.sex input{position:absolute;opacity:0;pointer-events:none}
.sex input:checked+span{color:var(--on)}
.sex label:has(input:checked){background:var(--violet);border-color:var(--violet);color:var(--on)}
.sex label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* settings */
.gear{position:fixed;z-index:20;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px),calc((100vw - 520px)/2));border:1px solid var(--line)}
main>header{padding-right:56px}
.set-list{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row:last-child{padding-bottom:0}
.set-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set-row .txt b{font-weight:800}
.set-row .txt span{font-size:12px;color:var(--dim)}
.sw{flex:0 0 auto;width:52px;height:32px;border-radius:999px;background:var(--off);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
/* заставка «Добро пожаловать» */
#splash{position:fixed;inset:0;z-index:100;background:#060e10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;cursor:pointer;transition:opacity .55s ease,visibility .55s;color:#fff;text-align:center}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(84vw,380px);height:auto;display:block;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);mask-composite:intersect;animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}
#splash h1{font-size:clamp(26px,7vw,36px);font-weight:800;letter-spacing:-.01em;margin:0;animation:spUp .7s .35s cubic-bezier(.2,.8,.2,1) both}
#splash p{margin:0;font-size:14px;color:#8fa59d;animation:spUp .7s .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes spIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<noscript><style>#splash{display:none}</style></noscript>
</head>

const PFB='#3a5fd8',PFR='#e8202e';
const PF={ /* sh/el/ha: плечо, локоть, кисть (смещение от центра x, y); hy: высота головы; k: интенсивность мышц */
 classic:{t:'Классические',sh:[120,140],el:[170,212],ha:[136,292],hy:150,k:{chest:.9,delt:.6,tri:.6},co:[['chest',-70,178],['tri',158,176]]},
 wide:{t:'Широкий хват',sh:[124,140],el:[194,204],ha:[208,290],hy:150,k:{chest:1,delt:.7,tri:.3},co:[['chest',-70,178],['delt',132,142]]},
 narrow:{t:'Узкий хват',sh:[112,140],el:[134,216],ha:[70,292],hy:150,k:{chest:.5,delt:.4,tri:1},co:[['tri',-124,176],['chest',70,178]]},
 diamond:{t:'Алмазные',sh:[114,140],el:[130,218],ha:[26,290],hy:150,k:{chest:.55,delt:.4,tri:1},co:[['tri',-124,178],['chest',70,178]]},
 decline:{t:'Ноги на возвышении',sh:[118,150],el:[168,220],ha:[134,294],hy:166,k:{uchest:1,delt:.9,tri:.5,chest:.3},co:[['uchest',-70,162],['delt',132,150]]},
 incline:{t:'Руки на возвышении',sh:[120,128],el:[168,200],ha:[136,278],hy:138,plat:1,k:{chest:.3,delt:.3,tri:.5,lchest:1},co:[['lchest',-68,190],['tri',158,164]]},
 pike:{t:'Пайк',sh:[106,112],el:[120,196],ha:[116,284],hy:196,k:{delt:1,tri:.7,traps:.8,uchest:.3},co:[['delt',-112,118],['traps',70,92]]},
 archer:{t:'Лучник',L:{sh:[-124,140],el:[-184,214],ha:[-200,290]},R:{sh:[116,140],el:[152,212],ha:[116,292]},hy:150,k:{chest:.9,delt:.6,tri:.8},co:[['chest',-72,178],['tri',152,176]]}
};
/* лента с плавным утолщением: p0→p1, ширины на концах и в «брюшке» */
function pfLimb(p0,p1,w0,wm,w1,bp,off){
  bp=bp||.5;off=off||0;
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux,N=14,A=[],B=[];
  for(let i=0;i<=N;i++){const t=i/N,w=t<bp?w0+(wm-w0)*Math.sin(t/bp*Math.PI/2):wm+(w1-wm)*(1-Math.cos((t-bp)/(1-bp)*Math.PI/2));
    const cx=p0[0]+dx*t+nx*off,cy=p0[1]+dy*t+ny*off;A.push([cx+nx*w/2,cy+ny*w/2]);B.push([cx-nx*w/2,cy-ny*w/2])}
  const f=q=>q[0].toFixed(1)+','+q[1].toFixed(1);
  return 'M'+A.map(f).join('L')+`A${w1/2},${w1/2} 0 0 0 ${f(B[N])}L`+B.slice(0,N).reverse().map(f).join('L')+`A${w0/2},${w0/2} 0 0 0 ${f(A[0])}Z`;
}
const pfEll=(cx,cy,rx,ry)=>`M${cx-rx},${cy} C${cx-rx},${cy-ry*1.33} ${cx+rx},${cy-ry*1.33} ${cx+rx},${cy} C${cx+rx},${cy+ry*1.33} ${cx-rx},${cy+ry*1.33} ${cx-rx},${cy}Z`;
function pushFig(key,label){
  const v=PF[key];if(!v)return'';
  const id='pf'+(++pfN),C=240,sy=(v.sh||v.R.sh)[1],dy=sy-140,k=v.k;let defs='',uid=0;
  const X=(s,str)=>str.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g,(m,x,y)=>`${C+s*x},${y}`);
  const rr=(x0,y0,x1,y1,r)=>`M${x0+r},${y0} L${x1-r},${y0} Q${x1},${y0} ${x1},${y0+r} L${x1},${y1-r} Q${x1},${y1} ${x1-r},${y1} L${x0+r},${y1} Q${x0},${y1} ${x0},${y1-r} L${x0},${y0+r} Q${x0},${y0} ${x0+r},${y0}Z`;
  /* одна мышца: заливка + объём (свет/тень) + волокна + контур */
  const mus=(d,kk,fib,solid)=>{const cid=id+'c'+(++uid);defs+=`<clipPath id="${cid}"><path d="${d}"/></clipPath>`;
    const hot=kk>0,col=hot?blend(PFB,PFR,Math.min(1,.45+.55*kk)):(solid||PFB);
    return `<path d="${d}" fill="${col}"/><g clip-path="url(#${cid})"><path d="${d}" fill="url(#${id}v)"/><path d="${d}" fill="none" stroke="#050a33" stroke-width="11" opacity=".6" filter="url(#${id}f)"/><g fill="none" stroke-linecap="round">${(fib||[]).map(f=>`<path d="${f}" stroke="#000" stroke-width="1.3" opacity=".25" transform="translate(1.4 1.6)"/><path d="${f}" stroke="${hot?'#ffc9cd':'#b4c5ff'}" stroke-width="1.4" opacity=".42"/>`).join('')}</g></g><path d="${d}" fill="none" stroke="${hot?'#560611':'#09124a'}" stroke-width="1.7" stroke-linejoin="round"/>`};
  const line=(p0,p1,off)=>{const dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*off,ny=dx/L*off;return `M${p0[0]+nx},${p0[1]+ny} Q${(p0[0]+p1[0])/2+nx*1.25},${(p0[1]+p1[1])/2+ny*1.25} ${p1[0]+nx*.7},${p1[1]+ny*.7}`};
  const fibs=(p0,p1,w)=>[-.36,-.18,0,.18,.36].map(f=>line(p0,p1,w*f));
  /* грудные: веер волокон от грудины */
  const PEC='M3,158 C26,146 74,136 114,146 C130,170 120,204 86,212 C54,220 18,216 3,206Z';
  const pecFib=s=>[0,1,2,3,4,5].map(i=>X(s,`M4,${176+i*6} Q54,${158+i*6} 112,${150+i*9}`));
  const UPEC='M3,156 C26,146 74,136 114,146 C120,160 118,174 112,184 C72,172 30,174 3,186Z';
  const LPEC='M3,184 C34,190 76,186 112,176 C122,194 112,208 86,212 C54,220 18,216 3,206Z';
  const pecs=(kk,ku,kl)=>[-1,1].map(s=>mus(X(s,PEC),kk,pecFib(s))+(ku>0?mus(X(s,UPEC),ku,pecFib(s).slice(0,3)):'')+(kl>0?mus(X(s,LPEC),kl,pecFib(s).slice(3)):'')).join('');
  const TRAP=`M${C},92 C${C-42},92 ${C-74},112 ${C-112},134 C${C-96},150 ${C-52},148 ${C},158 C${C+52},148 ${C+96},150 ${C+112},134 C${C+74},112 ${C+42},92 ${C},92Z`;
  const trapFib=[-2,-1,1,2].map(i=>`M${C+i*18},98 Q${C+i*26},126 ${C+i*40},148`);
  const sides=v.L?[v.L,v.R]:[{sh:[-v.sh[0],v.sh[1]],el:[-v.el[0],v.el[1]],ha:[-v.ha[0],v.ha[1]]},{sh:v.sh,el:v.el,ha:v.ha}];
  const A=a=>[C+a[0],a[1]];

  let o=`<svg class="pfig" viewBox="0 0 480 360" role="img" aria-label="Схема: ${v.t}. Красным выделены работающие мышцы"><defs>
   <radialGradient id="${id}b" cx="50%" cy="42%" r="78%"><stop offset="0" stop-color="#2d3445"/><stop offset="1" stop-color="#090b10"/></radialGradient>
   <linearGradient id="${id}v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
   <filter id="${id}f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
   <filter id="${id}g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
   <clipPath id="${id}c"><rect width="480" height="360" rx="22"/></clipPath>`;
  let body=`<g clip-path="url(#${id}c)"><rect width="480" height="360" fill="url(#${id}b)"/><ellipse cx="${C}" cy="312" rx="190" ry="15" fill="#000" opacity=".55" filter="url(#${id}g)"/>`;
  if(v.plat)sides.forEach(s=>{const x=C+s.ha[0];body+=`<path d="${rr(x-38,s.ha[1]+10,x+38,s.ha[1]+52,9)}" fill="#3a4252" stroke="#0b0e14" stroke-width="2"/><path d="${rr(x-38,s.ha[1]+10,x+38,s.ha[1]+18,4)}" fill="#59637a"/>`});
  /* торс */
  body+=`<g transform="translate(0 ${dy})">`;
  body+=mus(`M${C-128},146 C${C-136},200 ${C-102},258 ${C-76},298 Q${C},324 ${C+76},298 C${C+102},258 ${C+136},200 ${C+128},146 Q${C},118 ${C-128},146Z`,0,[],'#233ba6');
  body+=mus(TRAP,k.traps||0,trapFib);
  [-1,1].forEach(s=>{body+=mus(X(s,'M114,172 C130,198 126,238 108,268 C88,262 74,240 72,214 C92,210 108,194 114,172Z'),0,[X(s,'M88,214 Q100,222 112,216'),X(s,'M86,232 Q100,240 112,232'),X(s,'M88,250 Q100,258 110,250')])});
  [0,1,2].forEach(r=>[-1,1].forEach(s=>{body+=mus(X(s,rr(4,222+r*26,40,244+r*26,9)),0,[X(s,`M10,${233+r*26} L34,${233+r*26}`)])}));
  body+=pecs(k.chest||0,k.uchest||0,k.lchest||0);
  body+=`</g>`;
  /* руки */
  sides.forEach((s,i)=>{
    const S=A(s.sh),E=A(s.el),H=A(s.ha),sg=s.sh[0]<0?1:-1,ex=Math.sign(H[0]-C)||(i?1:-1);
    body+=mus(pfLimb(E,H,44,48,30,.3),0,fibs(E,H,38).slice(1,4));
    body+=mus(pfLimb(S,E,40,46,34,.45,-sg*5),0,fibs(S,E,30).slice(1,4));                          /* бицепс (внутренняя сторона) */
    body+=mus(pfLimb(S,E,42,56,38,.4,sg*6),k.tri||0,fibs(S,E,40));                                          /* трицепс (внешняя сторона) */
    body+=mus(pfEll(0,0,35,39),k.delt||0,[-16,-6,6,16].map(x=>`M${x},-30 Q${x*1.5},0 ${x*1.1},30`)).replace(/^/,`<g transform="translate(${S[0]} ${S[1]}) rotate(${(Math.atan2(E[1]-S[1],E[0]-S[0])*180/Math.PI-90)*.6})">`)+'</g>';
    /* кисть */
    const hx=H[0],hy=H[1],th=-ex;
    [-15,-5,5,15].forEach((f,j)=>{body+=mus(pfLimb([hx+f,hy+10],[hx+f,hy+10+[15,19,19,15][j]],10,10.5,9,.5),0)});
    body+=mus(pfLimb([hx+th*24,hy-2],[hx+th*33,hy+16],11,11.5,9,.5),0);
    body+=mus(pfEll(hx,hy+2,26,19),0,[`M${hx-14},${hy-6} L${hx-14},${hy+12}`,`M${hx},${hy-8} L${hx},${hy+14}`,`M${hx+14},${hy-6} L${hx+14},${hy+12}`]);
  });
  /* шея и голова */
  body+=mus(pfLimb([C,v.hy-34],[C,v.hy+10],46,52,52,.5),0);
  body+=mus(pfEll(C,v.hy,35,45),0,[`M${C-10},${v.hy-30} Q${C-22},${v.hy} ${C-12},${v.hy+30}`],'#3454c8');
  body+=`<ellipse cx="${C-11}" cy="${v.hy-18}" rx="11" ry="20" fill="#fff" opacity=".18"/>`;
  /* выноски-лупы */
  const zoom=(type,px,py,cx,cy)=>{
    const R=48,ang=Math.atan2(py-cy,px-cx),ex=cx+Math.cos(ang)*R,ey=cy+Math.sin(ang)*R,zid=id+'z'+cx;let z='';
    if(type==='chest'||type==='uchest'||type==='lchest')z=`<g transform="translate(${cx} ${cy+4}) scale(.6) translate(${-C} -176)">${pecs(1,0,0)}</g>`;
    else if(type==='tri')z=`<g transform="translate(${cx} ${cy}) rotate(18)">${mus(pfLimb([0,-46],[0,46],50,70,42,.4),1,fibs([0,-46],[0,46],56))}</g>`;
    else if(type==='delt')z=`<g transform="translate(${cx} ${cy})">${mus(pfEll(0,4,40,36),1,[-22,-11,0,11,22].map(x=>`M${x},-32 Q${x*1.6},0 ${x*1.1},36`))}</g>`;
    else z=`<g transform="translate(${cx} ${cy+10}) scale(.62) translate(${-C} -125)">${mus(TRAP,1,trapFib)}</g>`;
    return `<line x1="${ex}" y1="${ey}" x2="${px}" y2="${py}" stroke="#ff9aa1" stroke-width="2"/><circle cx="${px}" cy="${py}" r="4.5" fill="#0a0c11" stroke="#ff9aa1" stroke-width="2"/><clipPath id="${zid}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${R}" fill="#16277a"/><g clip-path="url(#${zid})"><rect x="${cx-R}" y="${cy-R}" width="${2*R}" height="${2*R}" fill="#2b47b8"/>${z}</g><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#ff9aa1" stroke-width="3"/>`;
  };
  v.co.forEach(([t,px,py],i)=>body+=zoom(t,C+px,py+(t==='tri'||t==='delt'||t==='traps'?0:dy),i?422:58,66));
  if(label)body+=`<text x="${C}" y="346" text-anchor="middle" style="font:900 italic 44px Arial Black,Arial,sans-serif;fill:#fff;stroke:#000;stroke-width:9;paint-order:stroke;stroke-linejoin:round">${label}</text>`;
  return o+defs+`</defs>`+body+`</g></svg>`;
}

/* ---------- расчёты ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wMin=n=>Math.max(1,Math.round(WK[n].ex.reduce((a,e)=>a+e.d+e.r,0)/60));
const exK=(w,e)=>(e.met||w.met)*S.weight*e.d/3600;
const wKcal=n=>{const w=WK[n];return Math.round(w.ex.reduce((a,e)=>a+exK(w,e),0)+REST_MET*S.weight*w.ex.reduce((a,e)=>a+e.r,0)/3600)};
function wInt(n){const c={};WK[n].ex.forEach(e=>e.m.forEach(m=>c[m]=(c[m]||0)+1));const top=Math.max(0,...Object.values(c));const r={};for(const m in c)r[m]=c[m]/top;return r}
const wMus=n=>{const i=wInt(n);return Object.keys(i).sort((a,b)=>i[b]-i[a])};
const fmt=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;

/* ---------- хранилище (на этом устройстве) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={tab:'home',filter:'Все',sheet:null,timer:null,prefill:null,
  schedule:store.get('skill.schedule',[]),log:store.get('skill.log',[]),weight:+store.get('skill.weight',70)||70,profile:store.get('skill.profile',null),
  set:Object.assign({sound:true,music:true,vibe:true},store.get('skill.settings',{}))};

function weekStats(){const from=new Date();from.setDate(from.getDate()-6);const f=iso(from);let n=0,k=0,m=0;S.log.forEach(e=>{if(e.d>=f){n++;k+=e.kcal;m+=e.min}});return{n,k,m:Math.round(m)}}
function streak(){const days=new Set(S.log.map(e=>e.d));const d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);let n=0;while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- общие куски ---------- */

const tags=n=>`<div class="tags"><span class="tag" style="--c:var(--accent)">${WK[n].cat}</span><span class="tag" style="--c:${LV[WK[n].lv]}">${WK[n].lv}</span></div>`;
const meta=n=>`<div class="meta num"><span>${wMin(n)} мин</span><span class="k">~${wKcal(n)} ккал</span><span>${WK[n].ex.length} упр.</span></div>`;
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 work:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
 plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',

/* ---------- экраны ---------- */
function vHome(){
  const d=new Date(), h=d.getHours();
  const greet=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  const g=S.profile&&GOALS[S.profile.goal],pool=g?g.w:NAMES;
  const n=pool[Math.floor(Date.now()/864e5)%pool.length], w=WK[n], ws=weekStats();
  return `<header><div class="eyebrow">${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}</div><h1 class="h1" style="margin-top:6px">${greet}!</h1></header>
  <div class="strip num"><div><b>${ws.n}</b><span>тренировок за 7 дней</span></div><div><b>${ws.k}</b><span>ккал сожжено</span></div><div><b>${streak()}</b><span>дней подряд</span></div></div>
  <section><div class="eyebrow" style="margin-bottom:10px">Тренировка дня${g?' · '+g.t.toLowerCase():''}</div>
   <div class="panel hero" style="--c:${w.c}">
    <div class="name">${n}</div>${tags(n)}
    <p class="dim" style="font-size:14px">${w.desc}</p>${meta(n)}
    <div style="max-width:300px;width:100%;margin:0 auto">${body(wInt(n),w.c,true)}</div>
    <div class="row"><button class="btn primary grow" style="--c:${w.c}" data-action="start" data-arg="${n}">Начать</button><button class="btn" data-action="open" data-arg="${n}">Подробнее</button></div>
   </div></section>
  <section><div class="section-head"><h2 class="h2">Все тренировки</h2><button class="dim" style="font-weight:800;font-size:13px" data-action="tab" data-arg="work">Открыть список</button></div>
   <div class="scroller">${NAMES.map(k=>`<button class="mini" style="--c:${WK[k].c}" data-action="open" data-arg="${k}"><i></i><b>${k}</b><span class="num">${wMin(k)} мин · ${wKcal(k)} ккал</span></button>`).join('')}</div></section>`;
}

  <div class="chips" role="group" aria-label="Категория">${CATS.map(c=>`<button class="chip" data-action="filter" data-arg="${c}" aria-pressed="${S.filter===c}">${c}</button>`).join('')}</div>

    <div class="go">${meta(n)}<button class="btn small primary" style="--c:${w.c}" data-action="start" data-arg="${n}">Старт</button></div></div>`}).join('')}</div>`;
}
function vPlan(){
  const today=iso(new Date()), sel=S.prefill||NAMES[0];
  const items=S.schedule.map((e,i)=>({...e,i})).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  return `<header><h1 class="h1">Расписание</h1><p class="dim" style="margin-top:6px">Запланируй тренировки заранее.</p></header>
  <div class="panel"><div class="form">
   <div class="field full"><label for="f-w">Тренировка</label><select class="inp" id="f-w">${NAMES.map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="field"><label for="f-d">Дата</label><input class="inp" id="f-d" type="date" value="${today}"></div>

const ACT=[['1.2','Сидячая','без тренировок'],['1.375','Лёгкая','1–3 в неделю'],['1.55','Средняя','3–5 в неделю'],['1.725','Высокая','6–7 в неделю'],['1.9','Очень высокая','2 в день']];
const NGOAL={loss:{t:'Похудение',k:.85,p:2,d:'−15% к норме'},keep:{t:'Поддержание веса',k:1,p:1.6,d:'норма без изменений'},gain:{t:'Набор мышечной массы',k:1.1,p:1.8,d:'+10% к норме'}};
S.nut=Object.assign({act:'1.55',goal:null},store.get('skill.nut',{}));
function nutGoal(){const g=S.nut.goal;if(NGOAL[g])return g;const pg=S.profile&&S.profile.goal;return pg==='loss'?'loss':pg==='gain'?'gain':'keep'}
function calcNut(p,act,goal){
  if(!p||!(p.height>0&&p.age>0&&S.weight>0))return null;
  const w=S.weight,g=NGOAL[goal]||NGOAL.keep;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);       /* формула Миффлина — Сан Жеора */
  const tdee=bmr*act;
  const kcal=Math.max(p.sex==='f'?1200:1500,tdee*g.k);
  const prot=Math.min(w*g.p,kcal*.35/4);                            /* белки, г */
  const fat=kcal*.25/9;                                             /* жиры, г: 25% калорий */
  const carb=Math.max(0,(kcal-prot*4-fat*9)/4);                     /* углеводы, г: всё остальное */
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal),p:Math.round(prot),f:Math.round(fat),c:Math.round(carb)};
}

/* ---------- музыка (синтез в браузере, без файлов) ---------- */
const music=(()=>{
  let c=null,out=null,timer=null,step=0,next=0;const BPM=124,ST=60/BPM/4;
  const BASS=[45,45,41,41,48,48,43,43],hz=m=>440*2**((m-69)/12);
  function ctx(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;return beep.c||(beep.c=new A())}
  function env(t,dur,vol){const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(out);return g}
  function kick(t){const o=c.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);o.connect(env(t,.3,.9));o.start(t);o.stop(t+.3)}
  function hat(t){const b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.buffer=b;s.connect(f);f.connect(env(t,.05,.25));s.start(t)}
  function bass(t,m){const o=c.createOscillator(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=600;o.connect(f);f.connect(env(t,ST*1.8,.35));o.start(t);o.stop(t+ST*2)}
  function sched(){while(next<c.currentTime+.15){const s=step%16,bar=Math.floor(step/16)%BASS.length;
    if(s%4===0)kick(next);if(s%4===2)hat(next);if(s%2===0||s===7)bass(next,BASS[bar]+(s===14?12:0));
    next+=ST;step++}}
  return{
    sync(){const on=S.set.music&&S.timer&&S.timer.running;
      if(on&&!timer){c=ctx();if(!c)return;c.resume&&c.resume();out=c.createGain();out.gain.setValueAtTime(.0001,c.currentTime);out.gain.exponentialRampToValueAtTime(.22,c.currentTime+.6);out.connect(c.destination);step=0;next=c.currentTime+.05;sched();timer=setInterval(sched,50)}
      else if(!on&&timer){clearInterval(timer);timer=null;const o=out;o.gain.setTargetAtTime(.0001,c.currentTime,.1);setTimeout(()=>o.disconnect(),600)}}
  };
})();

  if(T.phase==='done'){
    inner=`<div class="t-body" style="padding-top:24px"><div class="phase" style="color:var(--good)">Тренировка завершена</div><h2 class="t-ex">Отличная работа!</h2>
     <div class="done-num">${Math.round(T.kcal)}</div><div class="dim" style="margin-top:-8px">ккал сожжено</div>
     <div class="t-stats"><div><b>${fmt(T.elapsed)}</b><span>время</span></div><div><b>${n}</b><span>упражнений</span></div></div>
     <div class="t-map">${body({},w.c,true)}</div></div>`;
  }else{
    const phaseTxt=T.phase==='rest'?'Отдых':T.phase==='work'?'Работай':'Готов?',pc=T.phase==='rest'?'var(--warn)':T.phase==='work'?'var(--accent)':'var(--dim)';
    const label=T.running?'Пауза':T.phase==='ready'?'Старт':'Продолжить';
    inner=`<div class="t-body"><div class="phase" style="color:${pc}">${phaseTxt}</div><h2 class="t-ex">${T.phase==='rest'?'Дальше: '+show.n:e.n}</h2>
     <div class="ring"><svg viewBox="0 0 200 200"><circle class="rt" cx="100" cy="100" r="88"/><circle class="rp" id="t-ring" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="553"/></svg><div class="t-time" id="t-time">${fmt(T.left)}</div></div>
     <div class="t-stats"><div><b id="t-kcal">${Math.round(T.kcal)}</b><span>ккал</span></div><div><b id="t-el">${fmt(T.elapsed)}</b><span>время</span></div></div>
     <div class="row" style="width:100%"><button class="btn primary grow" data-action="tToggle">${label}</button><button class="btn" data-action="tSkip">Пропуск</button><button class="btn" data-action="tReset">Сброс</button></div>
     ${T.confirm?`<div class="confirm"><b>Выйти без сохранения?</b><div class="row"><button class="btn grow" data-action="tStay">Остаться</button><button class="btn primary grow" style="--c:var(--pink)" data-action="tExit">Выйти</button></div></div>`:''}
     ${show.fig?`<div class="t-fig">${pushFig(show.fig,show.lab)}</div>`:''}
     <div class="t-map">${body(Object.fromEntries(show.m.map(m=>[m,1])),w.c,true)}</div>
     <div class="eyebrow" style="color:${w.c}">${show.m.map(m=>MUSCLES[m]).join(' · ')||'Расслабление'}</div>
     <p class="dim" style="font-size:14px;max-width:360px">${show.t}</p>
     ${T.phase!=='rest'&&T.i<n-1?`<div class="eyebrow">Далее: ${w.ex[T.i+1].n}</div>`:''}</div>`;
  }
  el.innerHTML=`<div class="wrap" style="--c:${w.c}">${head}${inner}${T.phase==='done'?`</div><div class="actions" style="--c:${w.c}"><div class="in"><button class="btn primary" data-action="tClose">Готово</button></div></div><div>`:''}</div>`;
  tPaint();music.sync();
}
function tPaint(){
  const T=S.timer;if(!T||T.phase==='done')return;
  const t=$('#t-time');if(!t)return;t.textContent=fmt(T.left);
  const p=Math.max(0,Math.min(1,(T.total-T.left+T.acc)/T.total));
  $('#t-ring').setAttribute('stroke-dashoffset',(553*(1-p)).toFixed(1));
  $('#t-kcal').textContent=Math.round(T.kcal);$('#t-el').textContent=fmt(T.elapsed);
}
function tTick(){
  const T=S.timer;if(!T||!T.running)return;
  const now=performance.now();T.acc+=(now-T.last)/1000;T.last=now;
  while(T.acc>=1&&T.running){T.acc-=1;tStep()}
  tPaint();
}
// плавная перерисовка кольца каждый кадр, пока таймер идёт (setInterval страхует счёт в фоне, где кадры не рисуются)
function tLoop(){cancelAnimationFrame(raf);const T=S.timer;if(!T||!T.running)return;tTick();raf=requestAnimationFrame(tLoop)}
function tStep(){
  const T=S.timer,w=WK[T.n],e=w.ex[T.i];
  T.left--;T.elapsed++;
  T.kcal+=(T.phase==='work'?(e.met||w.met):REST_MET)*S.weight/3600;
  if(T.left<=0)tAdvance();
}
function tAdvance(){
  const T=S.timer,w=WK[T.n],last=T.i>=w.ex.length-1;
  if(T.phase==='work'){
    if(last){tFinish();return}
    const r=w.ex[T.i].r;
    if(r>0){T.phase='rest';T.left=T.total=r}else{T.i++;T.left=T.total=w.ex[T.i].d}
  }else if(T.phase==='rest'){T.i++;T.phase='work';T.left=T.total=w.ex[T.i].d}
  beep();renderTimer();
}
function tFinish(){
  const T=S.timer;T.running=false;T.phase='done';clearInterval(tid);tid=null;beep();
  const d=new Date();S.log.push({w:T.n,d:iso(d),t:pad(d.getHours())+':'+pad(d.getMinutes()),min:Math.round(T.elapsed/6)/10,kcal:Math.round(T.kcal)});
  store.set('skill.log',S.log);releaseWake();renderTimer();
}
async function takeWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function tToggle(){
  const T=S.timer;if(T.phase==='done')return;
  if(T.running){T.running=false;clearInterval(tid);tid=null;releaseWake()}
  else{if(T.phase==='ready')T.phase='work';T.running=true;T.last=performance.now();beep();takeWake();clearInterval(tid);tid=setInterval(tTick,250);tLoop()}
  renderTimer();
}
function tSkip(){const T=S.timer;if(T.phase==='done')return;if(T.phase==='ready')T.phase='work';T.left=0;T.acc=0;tAdvance()}
function tReset(){const T=S.timer,w=WK[T.n];clearInterval(tid);tid=null;releaseWake();Object.assign(T,{i:0,phase:'ready',total:w.ex[0].d,left:w.ex[0].d,running:false,acc:0,kcal:0,elapsed:0,confirm:false});renderTimer()}
function tClose(){
  const T=S.timer;if(!T)return;
  if(T.phase!=='done'&&T.elapsed>0&&!T.confirm){if(T.running){T.running=false;clearInterval(tid);tid=null}T.confirm=true;renderTimer();return}
  tExit();
}
function tExit(){clearInterval(tid);tid=null;releaseWake();const done=S.timer&&S.timer.phase==='done';S.timer=null;music.sync();$('#timer').hidden=true;document.documentElement.style.overflow='';if(done)S.tab='prog';render();window.scrollTo(0,0)}

/* ---------- действия ---------- */
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const A={
 themeToggle(){const t=THEME==='dark'?'light':'dark';store.set('skill.theme',t);applyTheme(t);render();renderSet();const b=document.querySelector('.sw[data-action="themeToggle"]');b&&b.focus()},
 tab(a){S.tab=a;render();window.scrollTo(0,0)},
 filter(a){S.filter=a;render()},
 open(a){openSheet(a)},
 closeSheet,
 start(a){startTimer(a)},
 plan(a){S.prefill=a;closeSheet();S.tab='plan';render();window.scrollTo(0,0)},
 addSched(){
  const w=$('#f-w').value,d=$('#f-d').value,t=$('#f-t').value;
  if(!d||!t){toast('Укажи дату и время');return}
  S.schedule.push({w,d,t});store.set('skill.schedule',S.schedule);S.prefill=null;render();toast('Добавлено в расписание');
 },
 delSched(a){S.schedule.splice(+a,1);store.set('skill.schedule',S.schedule);render()},
 saveW(){
  const v=parseFloat(String($('#f-kg').value).replace(',','.'));
  if(!(v>=25&&v<=300)){toast('Введи вес от 25 до 300 кг');return}
  S.weight=v;store.set('skill.weight',v);if(S.profile){S.profile.weight=v;store.set('skill.profile',S.profile)}toast('Вес сохранён, калории пересчитаны');render();
 },
 onbSkip(){store.set('skill.onb','skipped');closeOnb()},
 onbSave(){
  const num=id=>parseFloat(String($(id).value).replace(',','.'));
  const h=num('#o-h'),w=num('#o-w'),a=num('#o-a'),sex=(document.querySelector('input[name="f-sex"]:checked')||{}).value;
  if(!(h>=100&&h<=250)){toast('Введи рост от 100 до 250 см');return}
  if(!(w>=25&&w<=300)){toast('Введи вес от 25 до 300 кг');return}
  if(!(a>=10&&a<=100)){toast('Введи возраст от 10 до 100 лет');return}
  if(!sex){toast('Выбери пол');return}
  const goal=(document.querySelector('input[name="f-goal"]:checked')||{}).value;
  if(!goal){toast('Выбери цель тренировок');return}
  S.profile={height:Math.round(h),weight:w,age:Math.round(a),sex,goal};S.weight=w;
  store.set('skill.profile',S.profile);store.set('skill.weight',w);store.set('skill.onb','done');
  closeOnb();toast('Анкета сохранена');
 },
 calSave(){
  const num=id=>parseFloat(String($(id).value).replace(',','.'));
  const h=num('#c-h'),w=num('#c-w'),a=num('#c-a'),sex=(document.querySelector('input[name="c-sex"]:checked')||{}).value;
  if(!(h>=100&&h<=250)){toast('Введи рост от 100 до 250 см');return}
  if(!(w>=25&&w<=300)){toast('Введи вес от 25 до 300 кг');return}
  if(!(a>=10&&a<=100)){toast('Введи возраст от 10 до 100 лет');return}
  if(!sex){toast('Выбери пол');return}
  S.profile=Object.assign({},S.profile,{height:Math.round(h),weight:w,age:Math.round(a),sex});S.weight=w;
  store.set('skill.profile',S.profile);store.set('skill.weight',w);if(!store.get('skill.onb',null))store.set('skill.onb','done');
  S.nut={act:$('#c-act').value,goal:$('#c-goal').value};store.set('skill.nut',S.nut);
  render();toast('Норма рассчитана');
  const el=document.getElementById('nut-res');if(el)el.scrollIntoView({block:'start'});
 },
 onbOpen(){openOnb()},
 setOpen:openSet,setClose:closeSet,
 setToggle(k){S.set[k]=!S.set[k];store.set('skill.settings',S.set);music.sync();renderSet();
  const b=document.querySelector(`.sw[data-arg="${k}"]`);b&&b.focus();if(k==='sound'&&S.set.sound)beep()},
 tToggle,tSkip,tReset,tClose,tExit,tStay(){S.timer.confirm=false;renderTimer()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const f=A[b.dataset.action];f&&f(b.dataset.arg)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.wcard[data-action]')){e.preventDefault();A.open(e.target.dataset.arg)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.timer&&S.timer.running)takeWake()});
applyTheme(store.get('skill.theme','light'));
render();
if(!store.get('skill.onb',null))openOnb();
})();
</script>
<script>(function(){var s=document.getElementById('splash');if(!s)return;var done=false;function hide(){if(done)return;done=true;s.classList.add('out');setTimeout(function(){s.remove()},700)}
s.addEventListener('click',hide);document.addEventListener('keydown',hide,{once:true});setTimeout(hide,2800)})()</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
